[project]
name = "flatpak_external_data_checker"
version = "0.0.0"
requires-python = "<4.0,>=3.10"
# Sync with docker image
dependencies = [
    "aiohttp==3.14.5",
    "editorconfig==0.17.1",
    "jsonschema==4.26.0",
    "lxml==6.1.3",
    "packaging==26.3",
    "pyelftools==0.33",
    "PyGithub==2.10.0",
    "PyGObject==3.58.1",
    "python-magic==0.4.27",
    "ruamel.yaml==0.19.1",
    "semver==3.1.0",
    "toml==0.10.2",
    "yarl==1.25.1",
]

[dependency-groups]
dev = [
    "ty>=0.0.97,<0.1",
    "typing-extensions>=4.6,<5",
    "PyGObject-stubs>=2.11.0,<3",
    "ruff>=0.6.7,<1",
    "types-jsonschema>=4.23.0.20240813,<5",
    "types-lxml>=2024.9.16,<2027",
    "types-toml<0.10,<1",
    "pre-commit<5.0.0,>=3.8.0",
]

[ruff]
line-length = 88
include = ["*.py"]
target-version = "py310"

[ruff.format]
line-ending = "lf"
quote-style = "double"

[tool.ruff.lint]
select = [
    "A",
    "ANN",
    "B",
    "C4",
    "DTZ",
    "E",
    "ERA",
    "F",
    "I",
    "ICN",
    "PIE",
    "PL",
    "Q",
    "RSE",
    "RUF",
    "S",
    "UP",
    "W",
]
ignore = [
    "B015",
    "ANN401",
    "C400",
    "C416",
    "ERA001",
    "ICN001",
    "PLR0911",
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "PLR0917",
    "PLR2004",
    "RUF003",
    "RUF005",
    "RUF012",
    "RUF015",
    "RUF017",
    "RUF028",
    "RUF059",
    "S101",
    "S105",
    "S324",
    "S603",
    "S607",
]

[tool.ruff.lint.per-file-ignores]
# Require annotations only in these files.
"!{src/lib/{checksums,externaldata,releaselinks}.py,src/checkers/{__init__,electronchecker,forgejochecker,githubchecker,htmlchecker,jsonchecker}.py,typing_tests/**}" = ["ANN"]
"tests/*" = [
    "B017",
    "PLR1714",
    "PLW1641",
    "S101",
    "S103",
    "S108",
    "S318"
]

[tool.ty.environment]
# Match .python-version.
python-version = "3.11"

[tool.ty.src]
exclude = ["tests/"]

[tool.ty.analysis]
# The uv environment lacks stubs for these system bindings.
allowed-unresolved-imports = ["apt", "apt_inst", "apt_pkg", "gi.repository.Json"]

[tool.ty.rules]
dynamic-function-decorator-return = "error"
redundant-cast = "error"
unsound-return-statement = "error"
unused-ignore-comment = "error"
unused-type-ignore-comment = "error"

[[tool.ty.overrides]]
include = [
    "src/lib/externaldata.py",
    "src/lib/checksums.py",
    "src/lib/releaselinks.py",
    "src/checkers/__init__.py",
    "src/checkers/electronchecker.py",
    "src/checkers/forgejochecker.py",
    "src/checkers/githubchecker.py",
    "src/checkers/htmlchecker.py",
    "src/checkers/jsonchecker.py",
    "typing_tests/**",
]
[tool.ty.overrides.rules]
missing-type-argument = "error"

[[tool.ty.overrides]]
include = ["src/lib/externaldata.py"]
[tool.ty.overrides.rules]
# File and Git dataclasses narrow the mutable state fields.
invalid-mutable-override = "ignore"
